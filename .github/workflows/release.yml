name: Release

# A vX.Y.Z tag builds every release file, signs SHA256SUMS, attests the build provenance of
# each file and creates a draft GitHub release. Publishing the draft is left to the maintainer.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Tag and version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches package.json and has release notes
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package.json version $version."
            exit 1
          fi
          node scripts/release-notes.mjs "$version" > /dev/null

  helper:
    name: Helper app
    needs: version
    uses: ./.github/workflows/helper.yml

  extension:
    name: Extension packages
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @writehand/browser-extension zip:all
      - run: pnpm verify:packages
      - name: Collect the store packages and the source archive
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir extension
          # One Chromium package serves the Chrome Web Store and Edge Add-ons; Brave uses the Chrome Web Store.
          mv "apps/browser-extension/.output/writehand-$version-chrome.zip" "extension/writehand-$version-chromium.zip"
          mv "apps/browser-extension/.output/writehand-$version-firefox.zip" extension/
          # AMO reviews the source; docs/BUILD.md inside explains how to rebuild the packages.
          git archive --format=zip --prefix="writehand-$version-source/" -o "extension/writehand-$version-source.zip" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: extension/*
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [helper, extension]
    runs-on: ubuntu-24.04
    # The only job with the signing key and write access. In the `release` environment the key can be an
    # environment secret, limited to v* tags and, if wanted, to a manual approval (docs/RELEASING.md).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - run: cp apps/ai-companion/install/install.sh apps/ai-companion/install/install.ps1 apps/ai-companion/install/install-outlook.ps1 release/
      - name: Checksums and signature
        env:
          WRITEHAND_RELEASE_SIGNING_KEY: ${{ secrets.WRITEHAND_RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release.mjs release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs "$version" > notes.md
          ls -l release
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --title "Writehand $version" --notes-file notes.md
